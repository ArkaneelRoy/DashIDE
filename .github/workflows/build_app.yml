name: Build DashIDE APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Configure Gradle Environment
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC" >> ~/.gradle/gradle.properties

      - name: Fetch Packages
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation --target-platform=android-arm,android-arm64

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DashIDE-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
