name: Publish F-Droid Repo

on:
  release:
    types: [published]

jobs:
  build-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y apksigner
          pip install fdroidserver

      - name: Download Release APK
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          file: app-release.apk
          target: repo/app-release.apk

      - name: Initialize F-Droid Repo Structure
        run: |
          mkdir -p fdroid/repo
          mv repo/app-release.apk fdroid/repo/dashide_${{ github.event.release.tag_name }}.apk
          cd fdroid
          fdroid init --no-prompt

      - name: Build Repo Index
        run: |
          cd fdroid
          fdroid update -c

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./fdroid
          publish_branch: gh-pages
