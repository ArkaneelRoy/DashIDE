name: dash_ide
description: DashIDE - An on-device Flutter IDE built with Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_code_editor: ^0.3.1
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  path_provider: ^2.1.2
  http: ^1.2.1
  flutter_eval: ^0.7.2
  dart_eval: ^0.7.7
  archive: ^3.6.1
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
