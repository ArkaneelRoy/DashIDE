name: dash_ide
description: A robust mobile-first Flutter IDE.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_code_editor: any
  highlight: any
  flutter_highlight: any
  shared_preferences: any
  http: any
  open_filex: any
  path_provider: any
  archive: any
  dartssh2: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
